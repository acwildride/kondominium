<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Anmelden · Residence St. Agatha</title>
<style>
:root{
  --bg:#111111; --panel:#1a1a1a; --panel2:#202020; --line:#2a2f3a; --fg:#e8e8e8; --muted:#9aa0a6;
  --accent:#f5b83d; --gas:#5aa9e6; --strom:#f5b83d; --wasser:#4fd1c5; --spesen:#c4a7ff; --preise:#ff8a65; --pv:#9ccc65;
  --up:#ff7b72; --down:#7ee787;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.45}
a{color:inherit}

/* Kopfleiste */
.top{position:sticky;top:0;z-index:50;background:rgba(17,17,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:16px;min-height:52px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand .dot{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--accent),#e0663a);display:grid;place-items:center;color:#111}
.nav{list-style:none;margin:0 0 0 auto;padding:0;display:flex;flex-wrap:wrap;justify-content:flex-end}
.nav>li{position:relative}
.nav a,.nav button{display:block;background:none;border:0;color:var(--fg);font:inherit;font-size:14px;text-decoration:none;padding:15px 12px;cursor:pointer;border-bottom:2px solid transparent}
.nav a:hover,.nav button:hover{background:#1f1f1f}
.nav .on>a,.nav .on>button{border-bottom-color:var(--accent)}
.nav button::after{content:"";display:inline-block;margin-left:6px;width:6px;height:6px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);transform:translateY(-3px) rotate(45deg)}
.sub{display:none;position:absolute;right:0;top:100%;list-style:none;margin:0;padding:6px 0;background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:200px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.sub a{padding:8px 14px;border:0}
.sub a.cur{color:var(--accent)}
.nav li.open>.sub{display:block}
@media (hover:hover){.nav li:hover>.sub{display:block}}
.burger{display:none;margin-left:auto;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;padding:6px 10px;font:inherit;cursor:pointer}
@media (max-width:860px){
  .burger{display:block}
  .nav{display:none;width:100%;flex-direction:column;margin:0;padding-bottom:8px}
  .top .in{flex-wrap:wrap}
  .top.open .nav{display:flex}
  .nav a,.nav button{padding:10px 4px;width:100%;text-align:left}
  .sub{position:static;box-shadow:none;border:0;border-left:2px solid var(--line);border-radius:0;margin-left:6px;background:transparent}
}

/* Inhalt */
.wrap{max-width:1400px;margin:0 auto;padding:24px 16px 48px}
h1{font-weight:500;margin:0 0 6px;font-size:26px}
.lead{color:var(--muted);margin:0 0 6px;max-width:1000px;line-height:1.55}
.meta{font-size:12px;color:var(--muted);margin:0 0 18px}
.meta b{color:var(--fg);font-weight:500}
h3.sec{font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:28px 0 10px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:6px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,var(--accent))}
.kpi .t{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;margin:6px 0 2px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .v small{font-size:13px;color:var(--muted);margin-left:4px}
.kpi .s{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid>.full{grid-column:1/-1}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 8px;min-width:0;scroll-margin-top:70px}
.card h2{font-size:15px;font-weight:500;margin:0 0 2px}
.card p{font-size:12px;color:var(--muted);margin:0 0 6px}
.card .hd{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.card .hd a{font-size:12px;color:var(--muted);text-decoration:none;white-space:nowrap}
.card .hd a:hover{color:var(--fg)}
.card.leer{color:var(--muted);font-size:13px;padding:18px}

.toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.toc a{font-size:12px;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--panel)}
.toc a:hover{color:var(--fg);border-color:#3a404c}

/* Startseite */
.hero{position:relative;border-radius:14px;overflow:hidden;min-height:300px;display:flex;align-items:flex-end;border:1px solid var(--line);margin-bottom:16px;background:#1a1a1a}
.hero .img{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.02)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,17,17,.05) 0%,rgba(17,17,17,.35) 45%,rgba(17,17,17,.92) 100%)}
.hero .tx{position:relative;z-index:1;padding:26px 24px}
.hero h1{font-size:34px;font-weight:600;margin:0 0 4px;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.hero p{margin:0;color:#cfd3d8}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.tile{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;transition:border-color .15s,transform .15s,background .15s}
.tile:hover{border-color:var(--c);background:var(--panel2);transform:translateY(-2px)}
.tile .ic{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);margin-bottom:10px}
.tile b{display:block;font-weight:500;margin-bottom:3px}
.tile span{font-size:13px;color:var(--muted)}

.foot{max-width:1400px;margin:0 auto;padding:18px 16px 36px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
.foot a{color:var(--muted)}

body{min-height:100vh;display:grid;place-items:center;padding:16px}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(6px) brightness(.35);transform:scale(1.05);z-index:-1}
.login{width:100%;max-width:360px;background:rgba(26,26,26,.88);border:1px solid var(--line);border-radius:14px;padding:28px 24px;backdrop-filter:blur(6px)}
.login .dot{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#e0663a);display:grid;place-items:center;color:#111;margin-bottom:14px}
.login h1{font-size:22px;margin:0 0 4px}
.login p{color:var(--muted);font-size:13px;margin:0 0 18px}
.login label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
.login input{width:100%;background:#111;color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font:inherit;font-size:15px}
.login input:focus{outline:none;border-color:var(--accent)}
.login .row{display:flex;align-items:center;gap:8px;margin:12px 0 16px;font-size:13px;color:var(--muted)}
.login .row input{width:16px;height:16px;accent-color:var(--accent)}
.login button{width:100%;background:var(--fg);color:var(--bg);border:0;border-radius:8px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.login button:hover{background:#fff}
.err{color:var(--up);font-size:13px;min-height:18px;margin-top:10px}
.shake{animation:sh .35s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style></head>
<body>
<div class="bg" id="bg"></div>
<form class="login" id="f" autocomplete="off">
  <div class="dot"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7M5 10v10h14V10"/></svg></div>
  <h1>Residence St. Agatha</h1>
  <p>Kondominium · Spesen &amp; Energie</p>
  <label for="pw">Passwort</label>
  <input type="password" id="pw" autofocus>
  <div class="row"><input type="checkbox" id="merken" checked><label for="merken" style="margin:0">Auf diesem Gerät angemeldet bleiben</label></div>
  <button type="submit">Anmelden</button>
  <div class="err" id="err"></div>
</form>
<script>

async function sha(t){
  if(!(window.crypto&&crypto.subtle))return H;
  var d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));
  return Array.from(new Uint8Array(d)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
}
document.getElementById('f').addEventListener('submit',async function(e){
  e.preventDefault();
  var f=this, ok=(await sha(document.getElementById('pw').value))===H;
  if(ok){
    try{(document.getElementById('merken').checked?localStorage:sessionStorage).setItem('agatha_ok','1');}catch(x){}
    location.href='main.html';
  }else{
    document.getElementById('err').textContent='Falsches Passwort – bitte nochmals versuchen.';
    f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');
    document.getElementById('pw').select();
  }
});
</script>
</body></html>
